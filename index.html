<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Real-Time Chat</title>

    <style>
        /* ==============================
           GENERAL PAGE STYLING
        ============================== */

        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }


        /* ==============================
           AUTHENTICATION
        ============================== */

        .auth-container {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        .auth-container h3 {
            margin-top: 0;
            text-align: center;
            color: #333;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #666;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        .auth-btn {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #0056b3;
        }

        .toggle-text {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
        }

        .toggle-text span {
            color: #007bff;
            cursor: pointer;
            font-weight: bold;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }

        .success-msg {
            color: #28a745;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }


        /* ==============================
           CHAT CONTAINER
        ============================== */

        .chat-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }


        /* ==============================
           CHAT HEADER
        ============================== */

        .header {
            background: #007bff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #bd2130;
        }


        /* ==============================
           CHAT ROOMS
        ============================== */

        .room-bar {
            display: flex;
            background: #e9ecef;
            border-bottom: 1px solid #ddd;
            padding: 8px;
            justify-content: space-around;
        }

        .room-btn {
            border: none;
            background: white;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        .room-btn.active {
            background: #007bff;
            color: white;
        }


        /* ==============================
           CHAT WINDOW
        ============================== */

        #chat-window {
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }


        /* ==============================
           CHAT BUBBLES
        ============================== */

        .bubble-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        .theirs {
            align-self: flex-start;
            align-items: flex-start;
        }

        .sender-name {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .mine .bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .theirs .bubble {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .timestamp {
            font-size: 0.7rem;
            color: #999;
            margin-top: 2px;
        }


        /* ==============================
           TYPING STATUS
        ============================== */

        #typing-status {
            height: 20px;
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
            padding: 0 15px;
            background: #fafafa;
            display: flex;
            align-items: center;
        }


        /* ==============================
           MESSAGE INPUT
        ============================== */

        .input-area {
            display: flex;
            border-top: 1px solid #eee;
            padding: 10px;
            background: white;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        #send-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 8px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #send-button:hover {
            background: #0056b3;
        }
    </style>
</head>


<body>

    <!-- ==============================
         LOGIN / REGISTRATION
    ============================== -->

    <div id="auth-box" class="auth-container">

        <h3 id="auth-title">
            Login to Chat
        </h3>

        <div id="error-box" class="error-msg"></div>

        <div id="success-box" class="success-msg"></div>


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="off"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

        </div>


        <!-- LOGIN / REGISTER BUTTON -->

        <button
            id="auth-submit-btn"
            class="auth-btn"
            onclick="submitAuth()"
        >
            Login
        </button>


        <!-- TOGGLE LOGIN / REGISTER -->

        <p
            class="toggle-text"
            id="toggle-area"
        >
            Do not have an account?

            <span onclick="toggleAuthMode(true)">
                Register here
            </span>
        </p>

    </div>


    <!-- ==============================
         CHAT APPLICATION
    ============================== -->

    <div
        id="chat-box"
        class="chat-container"
        style="display: none;"
    >

        <!-- HEADER -->

        <div class="header">

            <h2 id="welcome-label">
                Live Network Hub 🌐
            </h2>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- CHAT ROOMS -->

        <div class="room-bar">

            <button
                class="room-btn active"
                onclick="switchRoom('general')"
                id="btn-general"
            >
                #general (0)
            </button>

            <button
                class="room-btn"
                onclick="switchRoom('gaming')"
                id="btn-gaming"
            >
                #gaming (0)
            </button>

            <button
                class="room-btn"
                onclick="switchRoom('music')"
                id="btn-music"
            >
                #music (0)
            </button>

        </div>


        <!-- CHAT WINDOW -->

        <div id="chat-window"></div>


        <!-- TYPING STATUS -->

        <div id="typing-status"></div>


        <!-- MESSAGE INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Type your message here..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        /* ==============================
           GLOBAL VARIABLES
        ============================== */

        let currentUser = null;
        let activeRoom = 'general';
        let socket = null;
        let isRegisterMode = false;

        let typingTimeout;
        let isCurrentlyTyping = false;


        /* ==============================
           DOM ELEMENTS
        ============================== */

        const chatWindow =
            document.getElementById('chat-window');

        const messageInput =
            document.getElementById('message-input');

        const sendButton =
            document.getElementById('send-button');

        const typingStatus =
            document.getElementById('typing-status');

        const errorBox =
            document.getElementById('error-box');

        const successBox =
            document.getElementById('success-box');


        /* ==============================
           LOGIN / REGISTER TOGGLE
        ============================== */

        function toggleAuthMode(toRegister) {

            isRegisterMode = toRegister;

            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            document.getElementById('username').value = '';
            document.getElementById('password').value = '';


            if (isRegisterMode) {

                document.getElementById(
                    'auth-title'
                ).textContent = 'Create Account';

                document.getElementById(
                    'auth-submit-btn'
                ).textContent = 'Register';

                document.getElementById(
                    'toggle-area'
                ).innerHTML =
                    'Already have an account? ' +
                    '<span onclick="toggleAuthMode(false)">' +
                    'Login here' +
                    '</span>';

            } else {

                document.getElementById(
                    'auth-title'
                ).textContent = 'Login to Chat';

                document.getElementById(
                    'auth-submit-btn'
                ).textContent = 'Login';

                document.getElementById(
                    'toggle-area'
                ).innerHTML =
                    'Do not have an account? ' +
                    '<span onclick="toggleAuthMode(true)">' +
                    'Register here' +
                    '</span>';
            }
        }


        /* ==============================
           LOGIN / REGISTRATION
        ============================== */

        async function submitAuth() {

            errorBox.style.display = 'none';
            successBox.style.display = 'none';


            const usernameVal =
                document.getElementById(
                    'username'
                ).value.trim();


            const passwordVal =
                document.getElementById(
                    'password'
                ).value;


            /* VALIDATION */

            if (!usernameVal || !passwordVal) {

                showError(
                    'Please fill out all fields.'
                );

                return;
            }


            /* SELECT ENDPOINT */

            const endpoint =
                isRegisterMode
                    ? '/register'
                    : '/login';


            try {

                const response =
                    await fetch(
                        endpoint,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                username:
                                    usernameVal,

                                password:
                                    passwordVal
                            })
                        }
                    );


                const data =
                    await response.json();


                /* SERVER ERROR */

                if (!response.ok) {

                    showError(
                        data.error ||
                        'Something went wrong.'
                    );

                    return;
                }


                /* REGISTRATION SUCCESS */

                if (isRegisterMode) {

                    successBox.textContent =
                        'Account created! You can now log in.';

                    successBox.style.display =
                        'block';

                    toggleAuthMode(false);

                } else {

                    /* LOGIN SUCCESS */

                    currentUser =
                        data.username;

                    initializeChatDashboard();
                }

            } catch (err) {

                console.error(err);

                showError(
                    'Could not connect to authentication server.'
                );
            }
        }


        /* ==============================
           DISPLAY ERROR
        ============================== */

        function showError(message) {

            errorBox.textContent =
                message;

            errorBox.style.display =
                'block';
        }


        /* ==============================
           INITIALIZE CHAT DASHBOARD
        ============================== */

        function initializeChatDashboard() {

            document.getElementById(
                'auth-box'
            ).style.display = 'none';


            document.getElementById(
                'chat-box'
            ).style.display = 'flex';


            document.getElementById(
                'welcome-label'
            ).textContent =
                `Hi, ${currentUser} 🌐`;


            chatWindow.innerHTML = '';


            /* DETERMINE WEBSOCKET PROTOCOL */

            const protocol =
                window.location.protocol === 'https:'
                    ? 'wss:'
                    : 'ws:';


            const host =
                window.location.host ||
                'localhost:3000';


            /* CREATE WEBSOCKET CONNECTION */

            socket =
                new WebSocket(
                    `${protocol}//${host}`
                );


            /* ==============================
               WEBSOCKET CONNECTED
            ============================== */

            socket.onopen = () => {

                socket.send(
                    JSON.stringify({
                        type: 'join_room',
                        room: activeRoom
                    })
                );
            };


            /* ==============================
               WEBSOCKET MESSAGE
            ============================== */

            socket.onmessage = (event) => {

                const data =
                    JSON.parse(event.data);


                /* ==========================
                   ROOM COUNTS
                ========================== */

                if (data.type === 'room_counts') {

                    document.getElementById(
                        'btn-general'
                    ).textContent =
                        `#general (${data.counts['general'] || 0})`;


                    document.getElementById(
                        'btn-gaming'
                    ).textContent =
                        `#gaming (${data.counts['gaming'] || 0})`;


                    document.getElementById(
                        'btn-music'
                    ).textContent =
                        `#music (${data.counts['music'] || 0})`;


                    return;
                }


                /* ==========================
                   CHAT HISTORY
                ========================== */

                if (data.type === 'chat_history') {

                    data.messages.forEach(
                        (msg) => {

                            const style =
                                msg.username === currentUser
                                    ? 'mine'
                                    : 'theirs';


                            renderBubble(
                                msg.username,
                                msg.text,
                                msg.time,
                                style
                            );
                        }
                    );

                    return;
                }


                /* ==========================
                   TYPING
                ========================== */

                if (data.type === 'typing') {

                    typingStatus.textContent =
                        `${data.username} is typing...`;

                    return;
                }


                /* ==========================
                   STOPPED TYPING
                ========================== */

                if (
                    data.type ===
                    'stopped_typing'
                ) {

                    typingStatus.textContent =
                        '';

                    return;
                }


                /* ==========================
                   CHAT MESSAGE
                ========================== */

                if (
                    data.type ===
                    'chat_message'
                ) {

                    renderBubble(
                        data.username,
                        data.text,
                        data.time,
                        'theirs'
                    );
                }
            };
        }


        /* ==============================
           LOGOUT
        ============================== */

        function logout() {

            if (socket) {
                socket.close();
            }


            currentUser = null;

            activeRoom = 'general';


            document.getElementById(
                'chat-box'
            ).style.display = 'none';


            document.getElementById(
                'auth-box'
            ).style.display = 'block';


            toggleAuthMode(false);
        }


        /* ==============================
           RENDER CHAT MESSAGE
        ============================== */

        function renderBubble(
            user,
            text,
            time,
            style
        ) {

            const wrapper =
                document.createElement(
                    'div'
                );


            wrapper.classList.add(
                'bubble-wrapper',
                style
            );


            /* DISPLAY USERNAME */

            if (style === 'theirs') {

                const nameLabel =
                    document.createElement(
                        'div'
                    );

                nameLabel.classList.add(
                    'sender-name'
                );

                nameLabel.textContent =
                    user;

                wrapper.appendChild(
                    nameLabel
                );
            }


            /* MESSAGE BUBBLE */

            const bubble =
                document.createElement(
                    'div'
                );

            bubble.classList.add(
                'bubble'
            );

            bubble.textContent =
                text;

            wrapper.appendChild(
                bubble
            );


            /* TIMESTAMP */

            const timeLabel =
                document.createElement(
                    'div'
                );

            timeLabel.classList.add(
                'timestamp'
            );

            timeLabel.textContent =
                time;

            wrapper.appendChild(
                timeLabel
            );


            /* ADD MESSAGE TO CHAT */

            chatWindow.appendChild(
                wrapper
            );


            /* SCROLL TO BOTTOM */

            chatWindow.scrollTop =
                chatWindow.scrollHeight;
        }


        /* ==============================
           SWITCH CHAT ROOM
        ============================== */

        function switchRoom(newRoomName) {

            if (
                newRoomName ===
                activeRoom
            ) {
                return;
            }


            /* REMOVE ACTIVE STATE */

            document.getElementById(
                `btn-${activeRoom}`
            ).classList.remove(
                'active'
            );


            /* ADD ACTIVE STATE */

            document.getElementById(
                `btn-${newRoomName}`
            ).classList.add(
                'active'
            );


            /* UPDATE ACTIVE ROOM */

            activeRoom =
                newRoomName;


            /* CLEAR CHAT */

            chatWindow.innerHTML =
                '';


            typingStatus.textContent =
                '';


            /* JOIN NEW ROOM */

            if (
                socket &&
                socket.readyState ===
                    WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: 'join_room',
                        room: activeRoom
                    })
                );
            }
        }


        /* ==============================
           SEND TYPING SIGNAL
        ============================== */

        function sendTypingSignal(
            statusType
        ) {

            if (
                socket &&
                socket.readyState ===
                    WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: statusType,
                        username: currentUser
                    })
                );
            }
        }


        /* ==============================
           TYPING DETECTION
        ============================== */

        messageInput.addEventListener(
            'input',
            () => {

                /* USER STARTED TYPING */

                if (!isCurrentlyTyping) {

                    isCurrentlyTyping =
                        true;

                    sendTypingSignal(
                        'typing'
                    );
                }


                /* RESET TIMER */

                clearTimeout(
                    typingTimeout
                );


                /* USER STOPPED TYPING */

                typingTimeout =
                    setTimeout(
                        () => {

                            isCurrentlyTyping =
                                false;

                            sendTypingSignal(
                                'stopped_typing'
                            );

                        },
                        1500
                    );
            }
        );


        /* ==============================
           SEND MESSAGE
        ============================== */

        function dispatchMessage() {

            const messageText =
                messageInput.value.trim();


            if (
                messageText !== '' &&
                socket &&
                socket.readyState ===
                    WebSocket.OPEN
            ) {

                /* CURRENT TIME */

                const currentTime =
                    new Date().toLocaleTimeString(
                        [],
                        {
                            hour: '2-digit',
                            minute: '2-digit'
                        }
                    );


                /* STOP TYPING */

                clearTimeout(
                    typingTimeout
                );

                isCurrentlyTyping =
                    false;

                sendTypingSignal(
                    'stopped_typing'
                );


                /* CREATE MESSAGE */

                const payload = {

                    type:
                        'chat_message',

                    username:
                        currentUser,

                    text:
                        messageText,

                    time:
                        currentTime
                };


                /* SEND MESSAGE */

                socket.send(
                    JSON.stringify(
                        payload
                    )
                );


                /* DISPLAY OWN MESSAGE */

                renderBubble(
                    currentUser,
                    messageText,
                    currentTime,
                    'mine'
                );


                /* CLEAR INPUT */

                messageInput.value =
                    '';
            }
        }


        /* ==============================
           SEND BUTTON
        ============================== */

        sendButton.addEventListener(
            'click',
            dispatchMessage
        );


        /* ==============================
           ENTER KEY
        ============================== */

        messageInput.addEventListener(
            'keypress',
            (event) => {

                if (
                    event.key ===
                    'Enter'
                ) {

                    dispatchMessage();
                }
            }
        );

    </script>

</body>

</html>
