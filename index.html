<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Real-Time Chat</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* ==============================
           AUTHENTICATION BOX
        ============================== */

        .auth-container {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        .auth-container h3 {
            margin-top: 0;
            text-align: center;
            color: #333;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #666;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        .auth-btn {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #0056b3;
        }

        .toggle-text {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
        }

        .toggle-text span {
            color: #007bff;
            cursor: pointer;
            font-weight: bold;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }

        .success-msg {
            color: #28a745;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }

        /* ==============================
           CHAT APPLICATION
        ============================== */

        .chat-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #007bff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #bd2130;
        }

        .room-bar {
            display: flex;
            background: #e9ecef;
            border-bottom: 1px solid #ddd;
            padding: 8px;

            border: none;
            background: white;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;

        #chat-window {
            height: 300px;

            padding: 15px;

        }

        #typing-status {

        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;

            font-size: 0.95rem;
        }

        #send-button {
            background: #007bff;

        }
    </style>
</head>

<body>

    <!-- ==============================
         1. REGISTRATION & LOGIN
    ============================== -->

    <div id="auth-box" class="auth-container">

        <h3 id="auth-title">Login to Chat</h3>

        <div id="error-box" class="error-msg"></div>

        <div id="success-box" class="success-msg"></div>

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >
        </div>

        <button
            id="auth-submit-btn"
            class="auth-btn"
            onclick="submitAuth()"
        >
            Login
        </button>

        <p class="toggle-text" id="toggle-area">
            Do not have an account?
            <span onclick="toggleAuthMode(true)">
                Register here
            </span>
        </p>

    </div>


    <!-- ==============================
         2. MAIN CHAT DASHBOARD
    ============================== -->

    <div
        id="chat-box"
        class="chat-container"
        style="display: none;"
    >

        <div class="header">

            <h2 id="welcome-label">
                Live Network Hub 🌐
            </h2>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- CHAT ROOMS -->

        <div class="room-bar">

            <button
                class="room-btn active"
                onclick="switchRoom('general')"
                id="btn-general"
            >
                #general (0)
            </button>

            <button
                class="room-btn"
                onclick="switchRoom('gaming')"
                id="btn-gaming"
            >
                #gaming (0)
            </button>

            <button
                class="room-btn"
                onclick="switchRoom('music')"
                id="btn-music"
            >
                #music (0)
            </button>

        </div>


        <!-- CHAT WINDOW -->

        <div id="chat-window"></div>

        <div id="typing-status"></div>


        <!-- MESSAGE INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Type your message here..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <script>

        /* ==============================
           GLOBAL VARIABLES
        ============================== */

        let currentUser = null;
        let activeRoom = 'general';
        let socket = null;
        let isRegisterMode = false;

        let typingTimeout;
        let isCurrentlyTyping = false;


        /* ==============================
           DOM ELEMENTS
        ============================== */

        const chatWindow =
            document.getElementById('chat-window');

        const messageInput =
            document.getElementById('message-input');

        const sendButton =
            document.getElementById('send-button');

        const typingStatus =
            document.getElementById('typing-status');

        const errorBox =
            document.getElementById('error-box');

        const successBox =
            document.getElementById('success-box');


        /* ==============================
           TOGGLE LOGIN / REGISTER
        ============================== */

        function toggleAuthMode(toRegister) {

            isRegisterMode = toRegister;

            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            document.getElementById('username').value = '';
            document.getElementById('password').value = '';


            if (isRegisterMode) {

                document.getElementById('auth-title').textContent =
                    'Create Account';

                document.getElementById('auth-submit-btn').textContent =
                    'Register';

                document.getElementById('toggle-area').innerHTML =
                    'Already have an account? ' +
                    '<span onclick="toggleAuthMode(false)">' +
                    'Login here' +
                    '</span>';

            } else {

                document.getElementById('auth-title').textContent =
                    'Login to Chat';

                document.getElementById('auth-submit-btn').textContent =
                    'Login';

                document.getElementById('toggle-area').innerHTML =
                    'Do not have an account? ' +
                    '<span onclick="toggleAuthMode(true)">' +
                    'Register here' +
                    '</span>';
            }
        }


        /* ==============================
           LOGIN / REGISTRATION
        ============================== */

        async function submitAuth() {

            errorBox.style.display = 'none';
            successBox.style.display = 'none';


            const usernameVal =
                document.getElementById('username')
                    .value
                    .trim();

            const passwordVal =
                document.getElementById('password')
                    .value;


            if (!usernameVal || !passwordVal) {

                showError(
                    'Please fill out all fields.'
                );

                return;
            }


            const endpoint =
                isRegisterMode
                    ? '/register'
                    : '/login';


            try {

                const response = await fetch(
                    endpoint,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            username: usernameVal,
                            password: passwordVal
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    showError(
                        data.error ||
                        'Something went wrong.'
                    );

                    return;
                }


                if (isRegisterMode) {

                    successBox.textContent =
                        'Account created! You can now log in.';

                    successBox.style.display =
                        'block';

                    toggleAuthMode(false);

                } else {

                    currentUser =
                        data.username;

                    initializeChatDashboard();
                }

            } catch (err) {

                console.error(err);

                showError(
                    'Could not connect to authentication server.'
                );
            }
        }


        /* ==============================
           SHOW ERROR
        ============================== */

        function showError(message) {

            errorBox.textContent = message;

            errorBox.style.display = 'block';
        }


        /* ==============================
           INITIALIZE CHAT
        ============================== */

        function initializeChatDashboard() {

            document.getElementById('auth-box')
                .style.display = 'none';

            document.getElementById('chat-box')
                .style.display = 'flex';


            document.getElementById('welcome-label')
                .textContent =
                `Hi, ${currentUser} 🌐`;


            chatWindow.innerHTML = '';


            const protocol =
                window.location.protocol === 'https:'
                    ? 'wss:'
                    : 'ws:';


            const host =
                window.location.host ||
                'localhost:3000';


            socket =
                new WebSocket(
                    `${protocol}//${host}`
                );


            /* ==============================
               SOCKET CONNECTED
            ============================== */

            socket.onopen = () => {

                socket.send(
                    JSON.stringify({
                        type: 'join_room',
                        room: activeRoom
                    })
                );
            };


            /* ==============================
               SOCKET MESSAGE
            ============================== */

            socket.onmessage = (event) => {

                const data =
                    JSON.parse(event.data);


                /* ROOM COUNTS */

                if (data.type === 'room_counts') {

                    document.getElementById(
                        'btn-general'
                    ).textContent =
                        `#general (${data.counts['general'] || 0})`;


                    document.getElementById(
                        'btn-gaming'
                    ).textContent =
                        `#gaming (${data.counts['gaming'] || 0})`;


                    document.getElementById(
                        'btn-music'
                    ).textContent =
                        `#music (${data.counts['music'] || 0})`;


                    return;
                }


                /* CHAT HISTORY */

                if (data.type === 'chat_history') {

                    data.messages.forEach(
                        (msg) => {

                            const style =
                                msg.username === currentUser
                                    ? 'mine'
                                    : 'theirs';


                            renderBubble(
                                msg.username,
                                msg.text,
                                msg.time,
                                style
                            );
                        }
                    );

                    return;
                }


                /* TYPING */

                if (data.type === 'typing') {

                    typingStatus.textContent =
                        `${data.username} is typing...`;

                    return;
                }


                /* STOPPED TYPING */

                if (data.type === 'stopped_typing') {

                    typingStatus.textContent = '';

                    return;
                }


                /* NORMAL CHAT MESSAGE */

                renderBubble(
                    data.username,
                    data.text,
                    data.time,
                    'theirs'
                );
            };
        }


        /* ==============================
           LOGOUT
        ============================== */

        function logout() {

            if (socket) {
                socket.close();
            }


            currentUser = null;

            activeRoom = 'general';


            document.getElementById('chat-box')
                .style.display = 'none';


            document.getElementById('auth-box')
                .style.display = 'block';


            toggleAuthMode(false);
        }


        /* ==============================
           RENDER CHAT BUBBLE
        ============================== */

        function renderBubble(
            user,
            text,
            time,
            style
        ) {

            const wrapper =
                document.createElement('div');


            wrapper.classList.add(
                'bubble-wrapper',
                style
            );


            /* OTHER USER NAME */

            if (style === 'theirs') {

                const nameLabel =
                    document.createElement('div');

                nameLabel.classList.add(
                    'sender-name'
                );

                nameLabel.textContent =
                    user;

                wrapper.appendChild(
                    nameLabel
                );
            }


            /* MESSAGE */

            const bubble =
                document.createElement('div');

            bubble.classList.add(
                'bubble'
            );

            bubble.textContent =
                text;

            wrapper.appendChild(
                bubble
            );


            /* TIMESTAMP */

            const timeLabel =
                document.createElement('div');

            timeLabel.classList.add(
                'timestamp'
            );

            timeLabel.textContent =
                time;

            wrapper.appendChild(
                timeLabel
            );


            chatWindow.appendChild(
                wrapper
            );


            chatWindow.scrollTop =
                chatWindow.scrollHeight;
        }


        /* ==============================
           SWITCH CHAT ROOM
        ============================== */

        function switchRoom(newRoomName) {

            if (newRoomName === activeRoom) {
                return;
            }


            document.getElementById(
                `btn-${activeRoom}`
            ).classList.remove('active');


            document.getElementById(
                `btn-${newRoomName}`
            ).classList.add('active');


            activeRoom =
                newRoomName;


            chatWindow.innerHTML = '';

            typingStatus.textContent = '';


            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: 'join_room',
                        room: activeRoom
                    })
                );
            }
        }


        /* ==============================
           TYPING SIGNAL
        ============================== */

        function sendTypingSignal(statusType) {

            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: statusType,
                        username: currentUser
                    })
                );
            }
        }


        /* ==============================
           TYPING DETECTION
        ============================== */

        messageInput.addEventListener(
            'input',
            () => {

                if (!isCurrentlyTyping) {

                    isCurrentlyTyping = true;

                    sendTypingSignal(
                        'typing'
                    );
                }


                clearTimeout(
                    typingTimeout
                );


                typingTimeout =
                    setTimeout(
                        () => {

                            isCurrentlyTyping =
                                false;

                            sendTypingSignal(
                                'stopped_typing'
                            );

                        },
                        1500
                    );
            }
        );


        /* ==============================
           SEND MESSAGE
        ============================== */

        function dispatchMessage() {

            const messageText =
                messageInput.value.trim();


            if (
                messageText !== '' &&
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                const currentTime =
                    new Date().toLocaleTimeString(
                        [],
                        {
                            hour: '2-digit',
                            minute: '2-digit'
                        }
                    );


                clearTimeout(
                    typingTimeout
                );


                isCurrentlyTyping =
                    false;


                sendTypingSignal(
                    'stopped_typing'
                );


                const payload = {

                    type: 'chat_message',

                    username:
                        currentUser,

                    text:
                        messageText,

                    time:
                        currentTime
                };


                socket.send(
                    JSON.stringify(
                        payload
                    )
                );


                renderBubble(
                    currentUser,
                    messageText,
                    currentTime,
                    'mine'
                );


                messageInput.value = '';
            }
        }


        /* ==============================
           SEND BUTTON
        ============================== */

        sendButton.addEventListener(
            'click',
            dispatchMessage
        );


        /* ==============================
           ENTER KEY
        ============================== */

        messageInput.addEventListener(
            'keypress',
            (event) => {

                if (event.key === 'Enter') {

                    dispatchMessage();
                }
            }
        );

    </script>

</body>

</html>
