<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure DM Chat App</title>

    <style>

        /* =========================================
           GENERAL PAGE STYLING
        ========================================= */

        body {
            font-family: sans-serif;
            background-color: #f4f6f9;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            height: 100vh;
            margin: 0;
        }


        /* =========================================
           AUTHENTICATION CONTAINER
        ========================================= */

        .auth-container {
            width: 100%;
            max-width: 380px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);

            padding: 30px;

            box-sizing: border-box;
        }


        .auth-container h3 {
            margin-top: 0;

            text-align: center;

            color: #333;

            font-size: 1.4rem;
        }


        /* =========================================
           FORM GROUP
        ========================================= */

        .form-group {
            margin-bottom: 15px;
        }


        .form-group label {
            display: block;

            margin-bottom: 5px;

            font-size: 0.85rem;

            color: #666;

            font-weight: bold;
        }


        .form-group input {
            width: 100%;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 6px;

            box-sizing: border-box;

            font-size: 0.95rem;

            outline: none;
        }


        .form-group input:focus {
            border-color: #007bff;
        }


        /* =========================================
           AUTH BUTTON
        ========================================= */

        .auth-btn {
            width: 100%;

            background: #007bff;

            color: white;

            border: none;

            padding: 12px;

            border-radius: 6px;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }


        .auth-btn:hover {
            background: #0056b3;
        }


        /* =========================================
           AUTH TOGGLE
        ========================================= */

        .toggle-text {
            text-align: center;

            font-size: 0.85rem;

            color: #666;

            margin-top: 15px;
        }


        .toggle-text span {
            color: #007bff;

            cursor: pointer;

            font-weight: bold;
        }


        /* =========================================
           ERROR / SUCCESS MESSAGES
        ========================================= */

        .error-msg {
            color: #dc3545;

            font-size: 0.85rem;

            margin-bottom: 10px;

            text-align: center;

            display: none;
        }


        .success-msg {
            color: #28a745;

            font-size: 0.85rem;

            margin-bottom: 10px;

            text-align: center;

            display: none;
        }


        /* =========================================
           MAIN CHAT CONTAINER
        ========================================= */

        .chat-container {
            width: 90%;

            max-width: 800px;

            height: 80vh;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);

            overflow: hidden;

            display: flex;
        }


        /* =========================================
           LEFT SIDEBAR
        ========================================= */

        .sidebar {
            width: 250px;

            background: #2f3640;

            color: white;

            display: flex;

            flex-direction: column;

            border-right: 1px solid #ddd;
        }


        /* =========================================
           SIDEBAR HEADER
        ========================================= */

        .sidebar-header {
            padding: 15px;

            background: #1e222b;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .sidebar-header h3 {
            margin: 0;

            font-size: 1rem;

            word-break: break-all;

            max-width: 140px;
        }


        /* =========================================
           LOGOUT BUTTON
        ========================================= */

        .logout-btn {
            background: #dc3545;

            color: white;

            border: none;

            padding: 5px 10px;

            border-radius: 4px;

            font-size: 0.75rem;

            cursor: pointer;
        }


        /* =========================================
           SIDEBAR SECTION TITLES
        ========================================= */

        .section-title {
            font-size: 0.75rem;

            font-weight: bold;

            color: #718093;

            text-transform: uppercase;

            padding: 15px 15px 5px 15px;

            letter-spacing: 1px;
        }


        /* =========================================
           SIDEBAR LIST
        ========================================= */

        .list-container {
            display: flex;

            flex-direction: column;

            gap: 2px;

            padding: 0 10px;
        }


        /* =========================================
           SIDEBAR ITEMS
        ========================================= */

        .item-btn {
            border: none;

            background: transparent;

            color: #dcdde1;

            text-align: left;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 0.9rem;

            transition: background 0.2s;

            display: flex;

            justify-content: space-between;
        }


        .item-btn:hover {
            background: #3f4856;
        }


        .item-btn.active {
            background: #007bff;

            color: white;
        }


        /* =========================================
           MAIN CHAT PANEL
        ========================================= */

        .main-chat {
            flex: 1;

            display: flex;

            flex-direction: column;

            background: #fafafa;
        }


        /* =========================================
           CHAT HEADER
        ========================================= */

        .chat-header {
            padding: 15px;

            background: #fff;

            border-bottom: 1px solid #eee;

            font-weight: bold;

            font-size: 1.1rem;

            color: #333;
        }


        /* =========================================
           CHAT WINDOW
        ========================================= */

        #chat-window {
            flex: 1;

            overflow-y: auto;

            padding: 15px;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        /* =========================================
           MESSAGE BUBBLES
        ========================================= */

        .bubble-wrapper {
            display: flex;

            flex-direction: column;

            max-width: 70%;
        }


        .mine {
            align-self: flex-end;

            align-items: flex-end;
        }


        .theirs {
            align-self: flex-start;

            align-items: flex-start;
        }


        .sender-name {
            font-size: 0.75rem;

            color: #666;

            margin-bottom: 2px;

            font-weight: bold;
        }


        .bubble {
            padding: 10px 14px;

            border-radius: 18px;

            word-wrap: break-word;

            font-size: 0.95rem;
        }


        .mine .bubble {
            background: #007bff;

            color: white;

            border-bottom-right-radius: 2px;
        }


        .theirs .bubble {
            background: #e9ecef;

            color: #333;

            border-bottom-left-radius: 2px;
        }


        .timestamp {
            font-size: 0.7rem;

            color: #999;

            margin-top: 2px;
        }


        /* =========================================
           TYPING STATUS
        ========================================= */

        #typing-status {
            height: 20px;

            font-size: 0.8rem;

            color: #666;

            font-style: italic;

            padding: 0 15px;

            display: flex;

            align-items: center;
        }


        /* =========================================
           MESSAGE INPUT AREA
        ========================================= */

        .input-area {
            display: flex;

            border-top: 1px solid #eee;

            padding: 10px;

            background: white;
        }


        #message-input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 20px;

            outline: none;

            font-size: 0.95rem;
        }


        #send-button {
            background: #007bff;

            color: white;

            border: none;

            padding: 0 20px;

            margin-left: 8px;

            border-radius: 20px;

            font-weight: bold;

            cursor: pointer;
        }

    </style>
</head>


<body>

    <!-- =========================================
         AUTHENTICATION FORM
    ========================================= -->

    <div
        id="auth-box"
        class="auth-container"
    >

        <h3 id="auth-title">
            Login to Chat
        </h3>


        <div
            id="error-box"
            class="error-msg"
        ></div>


        <div
            id="success-box"
            class="success-msg"
        ></div>


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="off"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

        </div>


        <!-- AUTH BUTTON -->

        <button
            id="auth-submit-btn"
            class="auth-btn"
            onclick="submitAuth()"
        >
            Login
        </button>


        <!-- LOGIN / REGISTER TOGGLE -->

        <p
            class="toggle-text"
            id="toggle-area"
        >
            Do not have an account?

            <span onclick="toggleAuthMode(true)">
                Register here
            </span>
        </p>

    </div>


    <!-- =========================================
         MAIN CHAT INTERFACE
    ========================================= -->

    <div
        id="chat-box"
        class="chat-container"
        style="display: none;"
    >

        <!-- =====================================
             LEFT SIDEBAR
        ====================================== -->

        <div class="sidebar">

            <!-- SIDEBAR HEADER -->

            <div class="sidebar-header">

                <h3 id="welcome-label">
                    User
                </h3>

                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>


            <!-- ROOMS -->

            <div class="section-title">
                Rooms
            </div>


            <div
                class="list-container"
                id="rooms-list"
            >

                <button
                    class="item-btn active"
                    id="room-general"
                    onclick="switchRoom('general')"
                >
                    # general

                    <span id="count-general">
                        (0)
                    </span>
                </button>


                <button
                    class="item-btn"
                    id="room-gaming"
                    onclick="switchRoom('gaming')"
                >
                    # gaming

                    <span id="count-gaming">
                        (0)
                    </span>
                </button>


                <button
                    class="item-btn"
                    id="room-music"
                    onclick="switchRoom('music')"
                >
                    # music

                    <span id="count-music">
                        (0)
                    </span>
                </button>

            </div>


            <!-- DIRECT MESSAGES -->

            <div class="section-title">
                Direct Messages 💬
            </div>


            <div
                class="list-container"
                id="users-list"
            >
                <!--
                    Online user buttons
                    will be generated dynamically.
                -->
            </div>

        </div>


        <!-- =====================================
             RIGHT CHAT PANEL
        ====================================== -->

        <div class="main-chat">

            <!-- CHAT HEADER -->

            <div
                class="chat-header"
                id="current-room-title"
            >
                # general
            </div>


            <!-- CHAT WINDOW -->

            <div id="chat-window"></div>


            <!-- TYPING STATUS -->

            <div id="typing-status"></div>


            <!-- MESSAGE INPUT -->

            <div class="input-area">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message here..."
                    autocomplete="off"
                >

                <button id="send-button">
                    Send
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* =========================================
           GLOBAL VARIABLES
        ========================================= */

        let currentUser = null;

        let activeRoom = 'general';

        let socket = null;

        let isRegisterMode = false;

        let typingTimeout;

        let isCurrentlyTyping = false;


        /* =========================================
           DOM ELEMENTS
        ========================================= */

        const chatWindow =
            document.getElementById('chat-window');

        const messageInput =
            document.getElementById('message-input');

        const sendButton =
            document.getElementById('send-button');

        const typingStatus =
            document.getElementById('typing-status');

        const errorBox =
            document.getElementById('error-box');

        const successBox =
            document.getElementById('success-box');


        /* =========================================
           LOGIN / REGISTER TOGGLE
        ========================================= */

        function toggleAuthMode(toRegister) {

            isRegisterMode = toRegister;

            errorBox.style.display = 'none';

            successBox.style.display = 'none';

            document.getElementById('username').value = '';

            document.getElementById('password').value = '';


            /* REGISTER MODE */

            if (isRegisterMode) {

                document.getElementById(
                    'auth-title'
                ).textContent = 'Create Account';

                document.getElementById(
                    'auth-submit-btn'
                ).textContent = 'Register';

                document.getElementById(
                    'toggle-area'
                ).innerHTML =
                    'Already have an account? ' +
                    '<span onclick="toggleAuthMode(false)">' +
                    'Login here' +
                    '</span>';

            }


            /* LOGIN MODE */

            else {

                document.getElementById(
                    'auth-title'
                ).textContent = 'Login to Chat';

                document.getElementById(
                    'auth-submit-btn'
                ).textContent = 'Login';

                document.getElementById(
                    'toggle-area'
                ).innerHTML =
                    'Do not have an account? ' +
                    '<span onclick="toggleAuthMode(true)">' +
                    'Register here' +
                    '</span>';
            }
        }


        /* =========================================
           LOGIN / REGISTRATION
        ========================================= */

        async function submitAuth() {

            errorBox.style.display = 'none';

            successBox.style.display = 'none';


            /* GET USERNAME */

            const usernameVal =
                document.getElementById(
                    'username'
                ).value.trim();


            /* GET PASSWORD */

            const passwordVal =
                document.getElementById(
                    'password'
                ).value;


            /* VALIDATE INPUT */

            if (!usernameVal || !passwordVal) {

                showError(
                    'Please fill out all fields.'
                );

                return;
            }


            /* SELECT API ENDPOINT */

            const endpoint =
                isRegisterMode
                    ? '/register'
                    : '/login';


            try {

                /* SEND REQUEST */

                const response =
                    await fetch(
                        endpoint,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                username:
                                    usernameVal,

                                password:
                                    passwordVal
                            })
                        }
                    );


                /* READ RESPONSE */

                const data =
                    await response.json();


                /* HANDLE SERVER ERROR */

                if (!response.ok) {

                    showError(
                        data.error ||
                        'Something went wrong.'
                    );

                    return;
                }


                /* REGISTRATION */

                if (isRegisterMode) {

                    successBox.textContent =
                        'Account created! You can now log in.';

                    successBox.style.display = 'block';

                    toggleAuthMode(false);

                }


                /* LOGIN */

                else {

                    currentUser = data.username;

                    initializeChatDashboard();
                }

            } catch (err) {

                console.error(err);

                showError(
                    'Could not connect to authentication server.'
                );
            }
        }


        /* =========================================
           DISPLAY ERROR
        ========================================= */

        function showError(msg) {

            errorBox.textContent = msg;

            errorBox.style.display = 'block';
        }


        /* =========================================
           INITIALIZE CHAT DASHBOARD
        ========================================= */

        function initializeChatDashboard() {

            document.getElementById(
                'auth-box'
            ).style.display = 'none';


            document.getElementById(
                'chat-box'
            ).style.display = 'flex';


            document.getElementById(
                'welcome-label'
            ).textContent = currentUser;


            chatWindow.innerHTML = '';


            /* DETERMINE WEBSOCKET PROTOCOL */

            const protocol =
                window.location.protocol === 'https:'
                    ? 'wss:'
                    : 'ws:';


            const host =
                window.location.host ||
                'localhost:3000';


            /* CREATE WEBSOCKET CONNECTION */

            socket =
                new WebSocket(
                    `${protocol}//${host}`
                );


            /* =====================================
               WEBSOCKET CONNECTED
            ===================================== */

            socket.onopen = () => {

                /* Register user identity */

                socket.send(
                    JSON.stringify({
                        type: 'init',
                        username: currentUser
                    })
                );


                /* Join default room */

                socket.send(
                    JSON.stringify({
                        type: 'join_room',
                        room: activeRoom
                    })
                );
            };


            /* =====================================
               WEBSOCKET MESSAGE RECEIVED
            ===================================== */

            socket.onmessage = (event) => {

                const data =
                    JSON.parse(event.data);


                /* =================================
                   STATE UPDATE
                ================================= */

                if (data.type === 'state_update') {

                    document.getElementById(
                        'count-general'
                    ).textContent =
                        `(${data.counts['general'] || 0})`;


                    document.getElementById(
                        'count-gaming'
                    ).textContent =
                        `(${data.counts['gaming'] || 0})`;


                    document.getElementById(
                        'count-music'
                    ).textContent =
                        `(${data.counts['music'] || 0})`;


                    updateOnlineUsersList(
                        data.users
                    );

                    return;
                }


                /* =================================
                   CHAT HISTORY
                ================================= */

                if (data.type === 'chat_history') {

                    data.messages.forEach(
                        (msg) => {

                            const style =
                                msg.username === currentUser
                                    ? 'mine'
                                    : 'theirs';


                            renderBubble(
                                msg.username,
                                msg.text,
                                msg.time,
                                style
                            );
                        }
                    );

                    return;
                }


                /* =================================
                   TYPING
                ================================= */

                if (data.type === 'typing') {

                    typingStatus.textContent =
                        `${data.username} is typing...`;

                    return;
                }


                /* =================================
                   STOPPED TYPING
                ================================= */

                if (
                    data.type ===
                    'stopped_typing'
                ) {

                    typingStatus.textContent = '';

                    return;
                }


                /* =================================
                   CHAT MESSAGE
                ================================= */

                if (
                    data.type ===
                    'chat_message'
                ) {

                    /*
                     * Only render incoming messages
                     * here. The sender already renders
                     * their own message inside
                     * dispatchMessage().
                     */

                    if (
                        data.username !==
                        currentUser
                    ) {

                        renderBubble(
                            data.username,
                            data.text,
                            data.time,
                            'theirs'
                        );
                    }
                }
            };


            /* =====================================
               WEBSOCKET ERROR
            ===================================== */

            socket.onerror = (error) => {

                console.error(
                    'WebSocket error:',
                    error
                );
            };


            /* =====================================
               WEBSOCKET CLOSED
            ===================================== */

            socket.onclose = () => {

                console.log(
                    'WebSocket connection closed.'
                );
            };
        }


        /* =========================================
           UPDATE ONLINE USERS LIST
        ========================================= */

        function updateOnlineUsersList(usersList) {

            const usersContainer =
                document.getElementById(
                    'users-list'
                );


            usersContainer.innerHTML = '';


            usersList.forEach(
                (user) => {

                    /* Do not display yourself */

                    if (
                        user === currentUser
                    ) {
                        return;
                    }


                    const userBtn =
                        document.createElement(
                            'button'
                        );


                    userBtn.classList.add(
                        'item-btn'
                    );


                    /*
                     * Create a shared DM room ID.
                     * Sorting guarantees both users
                     * generate the same room name.
                     */

                    const dmRoomId =
                        [
                            'dm',
                            currentUser,
                            user
                        ]
                            .sort()
                            .join('_');


                    userBtn.id =
                        `room-${dmRoomId}`;


                    userBtn.innerHTML =
                        `👤 ${user}`;


                    userBtn.onclick = () =>
                        switchRoom(
                            dmRoomId,
                            `DM with ${user}`
                        );


                    if (
                        activeRoom ===
                        dmRoomId
                    ) {

                        userBtn.classList.add(
                            'active'
                        );
                    }


                    usersContainer.appendChild(
                        userBtn
                    );
                }
            );
        }


        /* =========================================
           LOGOUT
        ========================================= */

        function logout() {

            if (socket) {

                socket.close();

                socket = null;
            }


            currentUser = null;

            activeRoom = 'general';

            chatWindow.innerHTML = '';

            typingStatus.textContent = '';


            document.getElementById(
                'chat-box'
            ).style.display = 'none';


            document.getElementById(
                'auth-box'
            ).style.display = 'block';


            toggleAuthMode(false);
        }


        /* =========================================
           RENDER MESSAGE BUBBLE
        ========================================= */

        function renderBubble(
            user,
            text,
            time,
            style
        ) {

            const wrapper =
                document.createElement(
                    'div'
                );


            wrapper.classList.add(
                'bubble-wrapper',
                style
            );


            /* Display sender name for others */

            if (style === 'theirs') {

                const nameLabel =
                    document.createElement(
                        'div'
                    );


                nameLabel.classList.add(
                    'sender-name'
                );


                nameLabel.textContent =
                    user;


                wrapper.appendChild(
                    nameLabel
                );
            }


            /* Message */

            const bubble =
                document.createElement(
                    'div'
                );


            bubble.classList.add(
                'bubble'
            );


            bubble.textContent =
                text;


            wrapper.appendChild(
                bubble
            );


            /* Timestamp */

            const timeLabel =
                document.createElement(
                    'div'
                );


            timeLabel.classList.add(
                'timestamp'
            );


            timeLabel.textContent =
                time;


            wrapper.appendChild(
                timeLabel
            );


            /* Add message to chat */

            chatWindow.appendChild(
                wrapper
            );


            /* Scroll to bottom */

            chatWindow.scrollTop =
                chatWindow.scrollHeight;
        }


        /* =========================================
           SWITCH ROOM / DIRECT MESSAGE
        ========================================= */

        function switchRoom(
            newRoomName,
            explicitTitle = null
        ) {

            if (
                newRoomName ===
                activeRoom
            ) {
                return;
            }


            /* Remove previous active state */

            const oldActiveBtn =
                document.querySelector(
                    '.item-btn.active'
                );


            if (oldActiveBtn) {

                oldActiveBtn.classList.remove(
                    'active'
                );
            }


            /* Set new active room */

            activeRoom =
                newRoomName;


            /* Highlight selected button */

            const currentActiveBtn =
                document.getElementById(
                    `room-${newRoomName}`
                );


            if (currentActiveBtn) {

                currentActiveBtn.classList.add(
                    'active'
                );
            }


            /* Update title */

            document.getElementById(
                'current-room-title'
            ).textContent =
                explicitTitle ||
                `# ${newRoomName}`;


            /* Clear current chat */

            chatWindow.innerHTML = '';

            typingStatus.textContent = '';


            /* Join room through WebSocket */

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: 'join_room',
                        room: activeRoom
                    })
                );
            }
        }


        /* =========================================
           SEND TYPING SIGNAL
        ========================================= */

        function sendTypingSignal(
            statusType
        ) {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: statusType,
                        username: currentUser
                    })
                );
            }
        }


        /* =========================================
           TYPING DETECTION
        ========================================= */

        messageInput.addEventListener(
            'input',
            () => {

                if (!isCurrentlyTyping) {

                    isCurrentlyTyping = true;

                    sendTypingSignal(
                        'typing'
                    );
                }


                clearTimeout(
                    typingTimeout
                );


                typingTimeout =
                    setTimeout(
                        () => {

                            isCurrentlyTyping =
                                false;

                            sendTypingSignal(
                                'stopped_typing'
                            );

                        },
                        1500
                    );
            }
        );


        /* =========================================
           SEND MESSAGE
        ========================================= */

        function dispatchMessage() {

            const messageText =
                messageInput.value.trim();


            if (
                messageText !== '' &&
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                const currentTime =
                    new Date().toLocaleTimeString(
                        [],
                        {
                            hour: '2-digit',
                            minute: '2-digit'
                        }
                    );


                /* Stop typing */

                clearTimeout(
                    typingTimeout
                );


                isCurrentlyTyping = false;


                sendTypingSignal(
                    'stopped_typing'
                );


                /* Build message */

                const payload = {

                    type: 'chat_message',

                    username:
                        currentUser,

                    text:
                        messageText,

                    time:
                        currentTime
                };


                /* Send to server */

                socket.send(
                    JSON.stringify(
                        payload
                    )
                );


                /*
                 * Render own message immediately.
                 * The WebSocket handler ignores our
                 * own broadcast to prevent duplicates.
                 */

                renderBubble(
                    currentUser,
                    messageText,
                    currentTime,
                    'mine'
                );


                /* Clear input */

                messageInput.value = '';
            }
        }


        /* =========================================
           SEND BUTTON
        ========================================= */

        sendButton.addEventListener(
            'click',
            dispatchMessage
        );


        /* =========================================
           ENTER KEY TO SEND
        ========================================= */

        messageInput.addEventListener(
            'keypress',
            (event) => {

                if (
                    event.key ===
                    'Enter'
                ) {

                    dispatchMessage();
                }
            }
        );

    </script>

</body>
