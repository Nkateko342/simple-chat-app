<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Real-Time Chat</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        /* AUTHENTICATION BOX STYLING */
        .auth-container { width: 100%; max-width: 380px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; box-sizing: border-box; }
        .auth-container h3 { margin-top: 0; text-align: center; color: #333; font-size: 1.4rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #666; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; outline: none; }
        .form-group input:focus { border-color: #007bff; }
        .auth-btn { width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-btn:hover { background: #0056b3; }
        .toggle-text { text-align: center; font-size: 0.85rem; color: #666; margin-top: 15px; }
        .toggle-text span { color: #007bff; cursor: pointer; font-weight: bold; }
        .error-msg { color: #dc3545; font-size: 0.85rem; margin-bottom: 10px; text-align: center; display: none; }
        .success-msg { color: #28a745; font-size: 0.85rem; margin-bottom: 10px; text-align: center; display: none; }

        /* CHAT APPLICATION STYLING */
        .chat-container { width: 100%; max-width: 450px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 1.1rem; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .logout-btn:hover { background: #bd2130; }

        .room-bar { display: flex; background: #e9ecef; border-bottom: 1px solid #ddd; padding: 8px; justify-content: space-around; }
        .room-btn { border: none; background: white; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: #555; }
        .room-btn.active { background: #007bff; color: white; }
        #chat-window { height: 300px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        
        .bubble-wrapper { display: flex; flex-direction: column; max-width: 70%; }
        .mine { align-self: flex-end; align-items: flex-end; }
        .theirs { align-self: flex-start; align-items: flex-start; }
        .sender-name { font-size: 0.75rem; color: #666; margin-bottom: 2px; font-weight: bold; }
        .bubble { padding: 10px 14px; border-radius: 18px; word-wrap: break-word; font-size: 0.95rem; }
        .mine .bubble { background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .theirs .bubble { background: #e9ecef; color: #333; border-bottom-left-radius: 2px; }
        .timestamp { font-size: 0.7rem; color: #999; margin-top: 2px; }
        #typing-status { height: 20px; font-size: 0.8rem; color: #666; font-style: italic; padding: 0 15px; background: #fafafa; display: flex; align-items: center; }
        
        .input-area { display: flex; border-top: 1px solid #eee; padding: 10px; background: white; }
        #message-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 0.95rem; }
        #send-button { background: #007bff; color: white; border: none; padding: 0 20px; margin-left: 8px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. REGISTRATION & LOGIN SCREEN LAYOUT -->
    <div id="auth-box" class="auth-container">
        <h3 id="auth-title">Login to Chat</h3>
        <div id="error-box" class="error-msg"></div>
        <div id="success-box" class="success-msg"></div>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button id="auth-submit-btn" class="auth-btn" onclick="submitAuth()">Login</button>
        <p class="toggle-text" id="toggle-area">Don't have an account? <span onclick="toggleAuthMode(true)">Register here</span></p>
    </div>

    <!-- 2. MAIN CHAT DASHBOARD LAYOUT (HIDDEN BY DEFAULT) -->
    <div id="chat-box" class="chat-container" style="display: none;">
        <div class="header">
            <h2 id="welcome-label">Live Network Hub 🌐</h2>
            <!-- LOGOUT CONTROL -->
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="room-bar">
            <button class="room-btn active" onclick="switchRoom('general')" id="btn-general">#general (0)</button>
            <button class="room-btn" onclick="switchRoom('gaming')" id="btn-gaming">#gaming (0)</button>
            <button class="room-btn" onclick="switchRoom('music')" id="btn-music">#music (0)</button>
        </div>

        <div id="chat-window"></div>
        <div id="typing-status"></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activeRoom = 'general';
        let socket = null;
        let isRegisterMode = false;

        let typingTimeout;
        let isCurrentlyTyping = false;

        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const typingStatus = document.getElementById('typing-status');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');

        // Toggle Visual elements between Login and Register states
        function toggleAuthMode(toRegister) {
            isRegisterMode = toRegister;
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            if (isRegisterMode) {
                document.getElementById('auth-title').textContent = 'Create Account';
                document.getElementById('auth-submit-btn').textContent = 'Register';
                document.getElementById('toggle-area').innerHTML = 'Already have an account? <span onclick="toggleAuthMode(false)">Login here</span>';
            } else {
                document.getElementById('auth-title').textContent = 'Login to Chat';
                document.getElementById('auth-submit-btn').textContent = 'Login';
                document.getElementById('toggle-area').innerHTML = 'Don\'t have an account? <span onclick="toggleAuthMode(true)">Register here</span>';
            }
        }

        // Post credentials over traditional HTTP routes
        async function submitAuth() {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value;

            if (!usernameVal || !passwordVal) {
                showError('Please fill out all fields.');
                return;
            }

            const endpoint = isRegisterMode ? '/register' : '/login';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Something went wrong.');
                    return;
                }

                if (isRegisterMode) {
                    successBox.textContent = 'Account created! You can now log in.';
                    successBox.style.display = 'block';
                    toggleAuthMode(false); // Move them to login view automatically
                } else {
                    // Login Success
                    currentUser = data.username;
                    initializeChatDashboard();
                }
            } catch (err) {
                showError('Could not connect to authentication server.');
            }
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        // Move layouts and start the WebSocket loop
        function initializeChatDashboard() {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            document.getElementById('welcome-label').textContent = `Hi, ${currentUser} 🌐`;
            
            chatWindow.innerHTML = '';

            // Setup WebSocket Connection
