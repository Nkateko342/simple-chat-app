<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat Suite</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        .auth-container h3 {
            margin-top: 0;
            text-align: center;
            color: #333;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #666;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
        }

        .avatar-picker-grid {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            justify-content: space-between;
        }

        .avatar-choice {
            font-size: 1.6rem;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .avatar-choice.selected {
            border-color: #007bff;
            background: #e3f2fd;
        }

        .auth-btn {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #0056b3;
        }

        .toggle-text {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
        }

        .toggle-text span {
            color: #007bff;
            cursor: pointer;
            font-weight: bold;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }

        .success-msg {
            color: #28a745;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #2f3640;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        .sidebar-header {
            padding: 15px;
            background: #1e222b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 150px;
        }

        .user-avatar-pic {
            font-size: 1.4rem;
        }

        .user-profile-badge h3 {
            margin: 0;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #718093;
            text-transform: uppercase;
            padding: 15px 15px 5px 15px;
            letter-spacing: 1px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0 10px;
        }

        .item-btn {
            border: none;
            background: transparent;
            color: #dcdde1;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-btn:hover {
            background: #3f4856;
        }

        .item-btn.active {
            background: #007bff;
            color: white;
        }

        .user-item-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            display: inline-block;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            position: relative;
        }

        .chat-header {
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble-wrapper {
            display: flex;
            gap: 10px;
            max-width: 75%;
            align-items: flex-start;
            position: relative;
        }

        .mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .theirs {
            align-self: flex-start;
            flex-direction: row;
        }

        .msg-avatar {
            font-size: 1.5rem;
            margin-top: 4px;
        }

        .msg-content-area {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .mine .msg-content-area {
            align-items: flex-end;
        }

        .theirs .msg-content-area {
            align-items: flex-start;
        }

        .sender-name {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 2px;
            font-weight: bold;
        }

        /* REPLY PREVIEW INSIDE BUBBLE */
        .reply-preview-box {
            background: rgba(0, 0, 0, 0.06);
            border-left: 3px solid #007bff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            max-width: 100%;
        }

        .mine .reply-preview-box {
            background: rgba(255, 255, 255, 0.2);
            border-left-color: #ffffff;
        }

        .reply-preview-user {
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 1px;
        }

        .reply-preview-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
            position: relative;
        }

        .mine .bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .theirs .bubble {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .timestamp {
            font-size: 0.7rem;
            color: #999;
            margin-top: 2px;
        }

        .reaction-bar {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            font-size: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .reaction-trigger-btn {
            border: none;
            background: #eee;
            padding: 2px 6px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.75rem;
            color: #555;
        }

        .reaction-trigger-btn:hover {
            background: #ddd;
        }

        .reaction-badge {
            background: white;
            border: 1px solid #ddd;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .reaction-badge.active {
            border-color: #007bff;
            background: #e3f2fd;
        }

        #typing-status {
            height: 20px;
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
            padding: 0 15px;
            display: flex;
            align-items: center;
        }

        /* INPUT AREA & REPLY BAR */
        .input-wrapper {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #eee;
            background: white;
        }

        .reply-target-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: #e3f2fd;
            border-left: 4px solid #007bff;
            padding: 6px 15px;
            font-size: 0.85rem;
            color: #333;
        }

        .reply-target-info {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .cancel-reply-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            align-items: center;
            position: relative;
        }

        #message-input {
            flex: 1;
            padding: 12px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        #send-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-left: 8px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="auth-box" class="auth-container">
        <h3 id="auth-title">Login to Chat</h3>
        <div id="error-box" class="error-msg"></div>
        <div id="success-box" class="success-msg"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="form-group" id="avatar-picker-section" style="display: none;">
            <label>Choose Profile Picture Icon</label>
            <div class="avatar-picker-grid">
                <span class="avatar-choice selected" onclick="selectAvatar(this, '🦊')">🦊</span>
                <span class="avatar-choice" onclick="selectAvatar(this, '🐱')">🐱</span>
                <span class="avatar-choice" onclick="selectAvatar(this, '🐼')">🐼</span>
                <span class="avatar-choice" onclick="selectAvatar(this, '🦁')">🦁</span>
                <span class="avatar-choice" onclick="selectAvatar(this, '🤖')">🤖</span>
            </div>
        </div>

        <button id="auth-submit-btn" class="auth-btn" onclick="submitAuth()">Login</button>

        <p class="toggle-text" id="toggle-area">
            Do not have an account? <span onclick="toggleAuthMode(true)">Register here</span>
        </p>
    </div>

    <div id="chat-box" class="chat-container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-badge">
                    <span class="user-avatar-pic" id="my-profile-avatar">🦊</span>
                    <h3 id="welcome-label">User</h3>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="section-title">Rooms</div>
            <div class="list-container" id="rooms-list">
                <button class="item-btn active" id="room-general" onclick="switchRoom('general')">
                    # general <span id="count-general">(0)</span>
                </button>
                <button class="item-btn" id="room-gaming" onclick="switchRoom('gaming')">
                    # gaming <span id="count-gaming">(0)</span>
                </button>
                <button class="item-btn" id="room-music" onclick="switchRoom('music')">
                    # music <span id="count-music">(0)</span>
                </button>
            </div>

            <div class="section-title">Direct Messages 💬</div>
            <div class="list-container" id="users-list"></div>
        </div>

        <div class="main-chat">
            <div class="chat-header" id="current-room-title"># general</div>
            <div id="chat-window"></div>
            <div id="typing-status"></div>

            <div class="input-wrapper">
                <!-- Reply Target Info Bar -->
                <div id="reply-target-bar" class="reply-target-bar">
                    <div class="reply-target-info" id="reply-target-text">
                        Replying to user...
                    </div>
                    <button class="cancel-reply-btn" onclick="cancelReplyTarget()">×</button>
                </div>

                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-button">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentAvatar = '🦊';
        let selectedRegisterAvatar = '🦊';

        let activeRoom = 'general';
        let socket = null;
        let isRegisterMode = false;

        let typingTimeout;
        let isCurrentlyTyping = false;

        // TRACKING ACTIVE REPLY STATE
        let currentReplyTarget = null;

        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const typingStatus = document.getElementById('typing-status');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');

        const replyTargetBar = document.getElementById('reply-target-bar');
        const replyTargetText = document.getElementById('reply-target-text');

        function setReplyTarget(msgId, username, text) {
            currentReplyTarget = { msgId, username, text };
            replyTargetText.innerHTML = `Replying to <b>${username}</b>: "${text}"`;
            replyTargetBar.style.display = 'flex';
            messageInput.focus();
        }

        function cancelReplyTarget() {
            currentReplyTarget = null;
            replyTargetBar.style.display = 'none';
        }

        function selectAvatar(element, emojiValue) {
            const choices = document.querySelectorAll('.avatar-choice');
            choices.forEach(choice => choice.classList.remove('selected'));
            element.classList.add('selected');
            selectedRegisterAvatar = emojiValue;
        }

        function toggleAuthMode(toRegister) {
            isRegisterMode = toRegister;
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            if (isRegisterMode) {
                document.getElementById('auth-title').textContent = 'Create Account';
                document.getElementById('auth-submit-btn').textContent = 'Register';
                document.getElementById('avatar-picker-section').style.display = 'block';
                document.getElementById('toggle-area').innerHTML = 'Already have an account? Login here';
            } else {
                document.getElementById('auth-title').textContent = 'Login to Chat';
                document.getElementById('auth-submit-btn').textContent = 'Login';
                document.getElementById('avatar-picker-section').style.display = 'none';
                document.getElementById('toggle-area').innerHTML = 'Do not have an account? Register here';
            }
        }

        async function submitAuth() {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value;

            if (!usernameVal || !passwordVal) {
                showError('Please fill out all fields.');
                return;
            }

            const endpoint = isRegisterMode ? '/register' : '/login';
            const bodyPayload = isRegisterMode
                ? { username: usernameVal, password: passwordVal, avatar: selectedRegisterAvatar }
                : { username: usernameVal, password: passwordVal };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyPayload)
                });
                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Something went wrong.');
                    return;
                }

                if (isRegisterMode) {
                    successBox.textContent = 'Account created! You can now log in.';
                    successBox.style.display = 'block';
                    toggleAuthMode(false);
                } else {
                    currentUser = data.username;
                    currentAvatar = data.avatar || '🦊';
                    initializeChatDashboard();
                }
            } catch (error) {
                showError('Could not connect to authentication server.');
            }
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function initializeChatDashboard() {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            document.getElementById('welcome-label').textContent = currentUser;
            document.getElementById('my-profile-avatar').textContent = currentAvatar;
            chatWindow.innerHTML = '';

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || 'localhost:3000';
            socket = new WebSocket(`${protocol}//${host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: 'init', username: currentUser, avatar: currentAvatar }));
                socket.send(JSON.stringify({ type: 'join_room', room: activeRoom }));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'state_update') {
                    document.getElementById('count-general').textContent = `(${data.counts['general'] || 0})`;
                    document.getElementById('count-gaming').textContent = `(${data.counts['gaming'] || 0})`;
                    document.getElementById('count-music').textContent = `(${data.counts['music'] || 0})`;
                    updateOnlineUsersList(data.users);
                    return;
                }

                if (data.type === 'chat_history') {
                    data.messages.forEach(message => {
                        const style = message.username === currentUser ? 'mine' : 'theirs';
                        renderBubble(
                            message.message_id,
                            message.username,
                            message.text,
                            message.time,
                            style,
                            message.avatar,
                            message.reactions,
                            message.reply_to_id,
                            message.reply_to_user,
                            message.reply_to_text
                        );
                    });
                    return;
                }

                if (data.type === 'toggle_reaction') {
                    updateBubbleReactionsLocally(data.message_id, data.username, data.emoji);
                    return;
                }

                if (data.type === 'typing') {
                    typingStatus.textContent = `${data.username} is typing...`;
                    return;
                }

                if (data.type === 'stopped_typing') {
                    typingStatus.textContent = '';
                    return;
                }

                if (data.type === 'chat_message') {
                    renderBubble(
                        data.message_id,
                        data.username,
                        data.text,
                        data.time,
                        'theirs',
                        data.avatar,
                        [],
                        data.reply_to_id,
                        data.reply_to_user,
                        data.reply_to_text
                    );
                }
            };
        }

        function updateOnlineUsersList(usersList) {
            const usersContainer = document.getElementById('users-list');
            usersContainer.innerHTML = '';

            usersList.forEach(user => {
                if (user.username === currentUser) return;

                const userBtn = document.createElement('button');
                userBtn.classList.add('item-btn');
                const dmRoomId = ['dm', currentUser, user.username].sort().join('_');
                userBtn.id = `room-${dmRoomId}`;
                userBtn.innerHTML = `
                    <div class="user-item-content">
                        <span>${user.avatar}</span>
                        <span>${user.username}</span>
                    </div>
                    <span class="status-dot"></span>
                `;

                userBtn.onclick = () => switchRoom(dmRoomId, `DM with ${user.username}`);
                if (activeRoom === dmRoomId) userBtn.classList.add('active');

                usersContainer.appendChild(userBtn);
            });
        }

        function logout() {
            if (socket) socket.close();
            currentUser = null;
            activeRoom = 'general';
            cancelReplyTarget();
            document.getElementById('chat-box').style.display = 'none';
            document.getElementById('auth-box').style.display = 'block';
            toggleAuthMode(false);
        }

        function emitReactionToggle(msgId, emojiStr) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                const payload = {
                    type: 'toggle_reaction',
                    message_id: msgId,
                    username: currentUser,
                    emoji: emojiStr
                };
                socket.send(JSON.stringify(payload));
                updateBubbleReactionsLocally(msgId, currentUser, emojiStr);
            }
        }

        function updateBubbleReactionsLocally(msgId, clickingUser, emojiStr) {
            const trayContainer = document.getElementById(`reactions-bar-${msgId}`);
            if (!trayContainer) return;

            const existingBadge = document.getElementById(`badge-${msgId}-${emojiStr}`);

            if (existingBadge) {
                let users = JSON.parse(existingBadge.getAttribute('data-users') || '[]');
                if (users.includes(clickingUser)) {
                    users = users.filter(user => user !== clickingUser);
                } else {
                    users.push(clickingUser);
                }

                if (users.length === 0) {
                    existingBadge.remove();
                } else {
                    existingBadge.setAttribute('data-users', JSON.stringify(users));
                    existingBadge.innerHTML = `${emojiStr} <span>${users.length}</span>`;
                    if (users.includes(currentUser)) existingBadge.classList.add('active');
                    else existingBadge.classList.remove('active');
                }
            } else {
                const badge = document.createElement('div');
                badge.classList.add('reaction-badge');
                badge.id = `badge-${msgId}-${emojiStr}`;
                badge.setAttribute('data-users', JSON.stringify([clickingUser]));
                badge.innerHTML = `${emojiStr} <span>1</span>`;
                if (clickingUser === currentUser) badge.classList.add('active');
                badge.onclick = () => emitReactionToggle(msgId, emojiStr);
                trayContainer.appendChild(badge);
            }
        }

        function renderBubble(
            msgId,
            user,
            text,
            time,
            style,
            avatarEmoji = '👤',
            reactionsArray = [],
            replyToId = null,
            replyToUser = null,
            replyToText = null
        ) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('bubble-wrapper', style);
            wrapper.id = `msg-wrapper-${msgId}`;

            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('msg-avatar');
            avatarDiv.textContent = avatarEmoji;
            wrapper.appendChild(avatarDiv);

            const contentArea = document.createElement('div');
            contentArea.classList.add('msg-content-area');

            if (style === 'theirs') {
                const nameLabel = document.createElement('div');
                nameLabel.classList.add('sender-name');
                nameLabel.textContent = user;
                contentArea.appendChild(nameLabel);
            }

            // RENDER REPLY PREVIEW IF IT REPLIES TO A MESSAGE
            if (replyToId && replyToUser && replyToText) {
                const replyBox = document.createElement('div');
                replyBox.classList.add('reply-preview-box');
                replyBox.innerHTML = `
                    <div class="reply-preview-user">${replyToUser}</div>
                    <div class="reply-preview-text">${replyToText}</div>
                `;
                replyBox.onclick = () => {
                    const targetBubble = document.getElementById(`msg-wrapper-${replyToId}`);
                    if (targetBubble) {
                        targetBubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                };
                contentArea.appendChild(replyBox);
            }

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.textContent = text;
            contentArea.appendChild(bubble);

            const timeLabel = document.createElement('div');
            timeLabel.classList.add('timestamp');
            timeLabel.textContent = time;
            contentArea.appendChild(timeLabel);

            const reactionBar = document.createElement('div');
            reactionBar.classList.add('reaction-bar');
            reactionBar.id = `reactions-bar-${msgId}`;

            // QUICK REPLY BUTTON NEXT TO REACTIONS
            const replyBtn = document.createElement('button');
            replyBtn.classList.add('reaction-trigger-btn');
            replyBtn.textContent = '↩️ Reply';
            replyBtn.onclick = () => setReplyTarget(msgId, user, text);
            reactionBar.appendChild(replyBtn);

            const quickReactions = ['👍', '❤️', '😂'];
            quickReactions.forEach(emoji => {
                const trigger = document.createElement('button');
                trigger.classList.add('reaction-trigger-btn');
                trigger.textContent = emoji;
                trigger.onclick = () => emitReactionToggle(msgId, emoji);
                reactionBar.appendChild(trigger);
            });

            contentArea.appendChild(reactionBar);
            wrapper.appendChild(contentArea);
            chatWindow.appendChild(wrapper);

            const grouped = {};
            reactionsArray.forEach(reaction => {
                if (!grouped[reaction.emoji]) grouped[reaction.emoji] = [];
                grouped[reaction.emoji].push(reaction.username);
            });

            Object.keys(grouped).forEach(emoji => {
                const badge = document.createElement('div');
                badge.classList.add('reaction-badge');
                badge.id = `badge-${msgId}-${emoji}`;
                badge.setAttribute('data-users', JSON.stringify(grouped[emoji]));
                badge.innerHTML = `${emoji} <span>${grouped[emoji].length}</span>`;

                if (grouped[emoji].includes(currentUser)) badge.classList.add('active');
                badge.onclick = () => emitReactionToggle(msgId, emoji);
                reactionBar.appendChild(badge);
            });

            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function switchRoom(newRoomName, explicitTitle = null) {
            if (newRoomName === activeRoom) return;

            const oldActiveBtn = document.querySelector('.item-btn.active');
            if (oldActiveBtn) oldActiveBtn.classList.remove('active');

            activeRoom = newRoomName;

            const currentActiveBtn = document.getElementById(`room-${newRoomName}`);
            if (currentActiveBtn) currentActiveBtn.classList.add('active');

            document.getElementById('current-room-title').textContent = explicitTitle || `# ${newRoomName}`;
            chatWindow.innerHTML = '';
            typingStatus.textContent = '';
            cancelReplyTarget();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'join_room', room: activeRoom }));
            }
        }

        function sendTypingSignal(statusType) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: statusType, username: currentUser }));
            }
        }

        messageInput.addEventListener('input', () => {
            if (!isCurrentlyTyping) {
                isCurrentlyTyping = true;
                sendTypingSignal('typing');
            }
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isCurrentlyTyping = false;
                sendTypingSignal('stopped_typing');
            }, 1500);
        });

        function dispatchMessage() {
            const messageText = messageInput.value.trim();

            if (messageText !== "" && socket && socket.readyState === WebSocket.OPEN) {
                const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const generatedMessageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

                clearTimeout(typingTimeout);
                isCurrentlyTyping = false;
                sendTypingSignal('stopped_typing');

                const payload = {
                    type: 'chat_message',
                    message_id: generatedMessageId,
                    username: currentUser,
                    avatar: currentAvatar,
                    text: messageText,
                    time: currentTime,
                    reply_to_id: currentReplyTarget ? currentReplyTarget.msgId : null,
                    reply_to_user: currentReplyTarget ? currentReplyTarget.username : null,
                    reply_to_text: currentReplyTarget ? currentReplyTarget.text : null
                };

                socket.send(JSON.stringify(payload));

                renderBubble(
                    generatedMessageId,
                    currentUser,
                    messageText,
                    currentTime,
                    'mine',
                    currentAvatar,
                    [],
                    payload.reply_to_id,
                    payload.reply_to_user,
                    payload.reply_to_text
                );

                messageInput.value = '';
                cancelReplyTarget();
            }
        }

        sendButton.addEventListener('click', dispatchMessage);
        messageInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') dispatchMessage();
        });
    </script>
</body>

</html>
